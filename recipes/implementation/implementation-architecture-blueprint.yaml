### AI Service Implementation
```typescript
interface AIService {
  generateResponse(prompt: string, context?: AIContext): Promise<AIResponse>;
}

class UnifiedAIService implements AIService {
  constructor(
    private modelFactory: AIModelFactory,
    private contextManager: ContextManager,
    private promptManager: PromptManager
  ) {}

  async generateResponse(prompt: string, context?: AIContext): Promise<AIResponse> {
    const optimizedContext = await this.contextManager.optimizeContext(context);
    const model = this.modelFactory.createOptimalModel(prompt);
    return await model.generateResponse(prompt, optimizedContext);
  }
}
```

