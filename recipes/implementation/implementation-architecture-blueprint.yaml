# ===== CODE ARCHITECTURE PRINCIPLES =====
code_architecture_principles:
  clean_architecture_principles:
    principle_1_dependency_inversion:
      description: "High-level modules should not depend on low-level modules; both should depend on abstractions"
      implementation_strategy:
        - "Define interfaces for all external dependencies"
        - "Use dependency injection containers"
        - "Implement repository pattern for data access"
        - "Abstract AI services behind interfaces"
      validation_approach: "[DEPENDENCY_ANALYSIS_TOOLS]"
      
    principle_2_single_responsibility:
      description: "Each class/module should have only one reason to change"
      implementation_strategy:
        - "Separate business logic from infrastructure concerns"
        - "Create focused, cohesive modules"
        - "Use composition over inheritance"
        - "Implement command/query separation"
      validation_approach: "[COMPLEXITY_METRICS_ANALYSIS]"
      
    principle_3_open_closed:
      description: "Software entities should be open for extension, closed for modification"
      implementation_strategy:
        - "Use strategy pattern for AI model switching"
        - "Implement plugin architecture for extensibility"
        - "Design configurable behavior through composition"
        - "Use event-driven architecture for loose coupling"
      validation_approach: "[EXTENSION_MECHANISM_TESTING]"
      
  ai_specific_principles:
    ai_principle_1_model_abstraction:
      description: "AI models should be abstracted to allow easy switching and testing"
      implementation_strategy:
        - "Create unified AI service interfaces"
        - "Implement model adapter pattern"
        - "Use factory pattern for model instantiation"
        - "Support multiple AI providers simultaneously"
      code_examples: "[AI_ABSTRACTION_CODE_EXAMPLES]"
      
    ai_principle_2_prompt_management:
      description: "Prompts should be managed as first-class citizens with versioning and testing"
      implementation_strategy:
        - "Centralized prompt template management"
        - "Version control for prompt evolution"
        - "A/B testing framework for prompts"
        - "Prompt validation and safety checking"
      code_examples: "[PROMPT_MANAGEMENT_CODE_EXAMPLES]"
      
    ai_principle_3_context_optimization:
      description: "Context management should be efficient and intelligent"
      implementation_strategy:
        - "Context compression algorithms"
        - "Intelligent context window management"
        - "Context relevance scoring"
        - "Automatic context cleanup"
      code_examples: "[CONTEXT_MANAGEMENT_CODE_EXAMPLES]"

