            content: "[ONBOARDING_TUTORIAL | BASIC_TASKS | QUICK_WINS]"
            
        feature_documentation:
          - component: "Feature Overview"
            content: "[FEATURE_PURPOSE | USE_CASES | BENEFITS]"
            
          - component: "How-to Guides"
