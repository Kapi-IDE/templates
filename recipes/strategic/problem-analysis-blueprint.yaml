# KAPI Problem Statement & Market Analysis Implementation Blueprint
# Based on: AI-Augmented Coding Playbook - Phase 1 WHY (Problem Statement & Market Research)
# Version: 1.0.0
# Purpose: Systematic problem validation and market analysis with AI-powered research and validation

blueprint_metadata:
  id: "problem-analysis-blueprint"
  version: "1.0.0"
  category: "strategic"
  blueprint_type: "foundation"
  last_updated: "2025-01-29"
  author: "KAPI AI Development Team"
  description: "Comprehensive problem validation and market analysis framework with AI-enhanced research capabilities"
  methodology: "Evidence-Based Problem Validation with Systematic Market Intelligence"
  deployment_time: "4-8 hours"
  customization_level: "high"

# ===== BLUEPRINT DEPLOYMENT CONTEXT =====
deployment_context:
  project_name: "[PROJECT_NAME]"
  problem_scope: "[SPECIFIC | BROAD | SYSTEMIC]"
  market_maturity: "[EMERGING | GROWING | MATURE | DECLINING]"
  research_budget: "[BOOTSTRAP | LIMITED | MODERATE | EXTENSIVE]"
  validation_timeline: "[DAYS | WEEKS | MONTHS]"
  research_team_size: "[SOLO | SMALL_TEAM | LARGE_TEAM]"
  geographic_scope: "[LOCAL | NATIONAL | GLOBAL]"

# ===== CORE PROBLEM DEFINITION FRAMEWORK =====
problem_definition_framework:
  problem_statement_structure:
    primary_problem:
      problem_description: "[CLEAR_CONCISE_PROBLEM_STATEMENT]"
      problem_category: "[TECHNICAL | BUSINESS | SOCIAL | EDUCATIONAL | HEALTHCARE]"
      problem_severity: "high" # critical | high | medium | low
      problem_frequency: "daily" # continuous | daily | weekly | monthly | occasional
      affected_population: "[WHO_EXPERIENCES_THIS_PROBLEM]"
      
    problem_context:
      environmental_factors:
        - factor: "[CONTEXTUAL_FACTOR_1]"
          impact: "high" # high | medium | low
          controllability: "low" # high | medium | low
          trend: "increasing" # increasing | stable | decreasing
          
        - factor: "[CONTEXTUAL_FACTOR_2]"
          impact: "medium"
          controllability: "medium"
          trend: "stable"
          
      historical_evolution:
        problem_origin: "[WHEN_AND_WHY_PROBLEM_EMERGED]"
        evolution_timeline: "[HOW_PROBLEM_HAS_CHANGED_OVER_TIME]"
        catalyst_events: ["[EVENT_1]", "[EVENT_2]"]
        future_trajectory: "[WHERE_PROBLEM_IS_HEADING_WITHOUT_INTERVENTION]"
        
    problem_impact_analysis:
      direct_impacts:
        - impact: "[IMMEDIATE_CONSEQUENCE_1]"
          affected_group: "[WHO_IS_AFFECTED]"
          severity: "high"
          frequency: "daily"
          quantification: "[MEASURABLE_IMPACT_DATA]"
          
        - impact: "[IMMEDIATE_CONSEQUENCE_2]"
          affected_group: "[AFFECTED_POPULATION]"
          severity: "medium"
          frequency: "weekly"
          quantification: "[IMPACT_MEASUREMENT]"
          
      indirect_impacts:
        - impact: "[SECONDARY_CONSEQUENCE_1]"
          affected_group: "[SECONDARY_AFFECTED_GROUP]"
          severity: "medium"
          delay: "[TIME_BETWEEN_CAUSE_AND_EFFECT]"
          
      systemic_impacts:
        organizational_impact: "[HOW_PROBLEM_AFFECTS_ORGANIZATIONS]"
        economic_impact: "[BROADER_ECONOMIC_CONSEQUENCES]"
        social_impact: "[SOCIETAL_LEVEL_CONSEQUENCES]"
        environmental_impact: "[ENVIRONMENTAL_CONSEQUENCES_IF_APPLICABLE]"

# ===== PROBLEM VALIDATION FRAMEWORK =====
problem_validation_framework:
  research_methodology:
    quantitative_research:
      survey_research:
        target_sample_size: "[NUMBER_OF_RESPONDENTS]"
        sampling_method: "[RANDOM | STRATIFIED | CONVENIENCE | SNOWBALL]"
        survey_distribution: "[ONLINE | EMAIL | PHONE | IN_PERSON]"
        key_questions:
          - question: "[PROBLEM_FREQUENCY_QUESTION]"
            question_type: "scale" # scale | multiple_choice | open_ended
            expected_insight: "[WHAT_THIS_REVEALS_ABOUT_PROBLEM]"
            
          - question: "[PROBLEM_SEVERITY_QUESTION]"
            question_type: "scale"
            expected_insight: "[INSIGHT_ABOUT_PROBLEM_IMPACT]"
            
          - question: "[CURRENT_SOLUTION_QUESTION]"
            question_type: "open_ended"
            expected_insight: "[UNDERSTANDING_OF_CURRENT_WORKAROUNDS]"
            
      market_data_analysis:
        data_sources: ["[DATA_SOURCE_1]", "[DATA_SOURCE_2]", "[DATA_SOURCE_3]"]
        metrics_to_analyze:
          - metric: "[RELEVANT_MARKET_METRIC_1]"
            source: "[DATA_SOURCE]"
            analysis_approach: "[HOW_TO_ANALYZE_THIS_METRIC]"
            
          - metric: "[RELEVANT_MARKET_METRIC_2]"
            source: "[DATA_SOURCE]"
            analysis_approach: "[ANALYSIS_METHOD]"
            
    qualitative_research:
      user_interviews:
        interview_targets:
          - segment: "[USER_SEGMENT_1]"
            sample_size: "[NUMBER_OF_INTERVIEWS]"
            recruitment_method: "[HOW_TO_FIND_PARTICIPANTS]"
            interview_format: "[STRUCTURED | SEMI_STRUCTURED | UNSTRUCTURED]"
            
        interview_guide:
          opening_questions:
            - "[QUESTION_TO_UNDERSTAND_CURRENT_WORKFLOW]"
            - "[QUESTION_TO_UNDERSTAND_CONTEXT]"
            
          problem_exploration:
            - "[QUESTION_TO_UNCOVER_PAIN_POINTS]"
            - "[QUESTION_TO_UNDERSTAND_IMPACT]"
            - "[QUESTION_TO_EXPLORE_WORKAROUNDS]"
            
          solution_preferences:
            - "[QUESTION_ABOUT_IDEAL_SOLUTION]"
            - "[QUESTION_ABOUT_SOLUTION_PRIORITIES]"
            - "[QUESTION_ABOUT_ADOPTION_BARRIERS]"
            
      observational_research:
        observation_contexts: ["[CONTEXT_1]", "[CONTEXT_2]"]
        observation_focus:
          - behavior: "[SPECIFIC_BEHAVIOR_TO_OBSERVE]"
            measurement: "[HOW_TO_MEASURE_THIS_BEHAVIOR]"
            expected_insight: "[WHAT_THIS_REVEALS]"
            
    expert_consultation:
      expert_categories:
        - expert_type: "[DOMAIN_EXPERT_TYPE_1]"
          consultation_format: "[INTERVIEW | SURVEY | WORKSHOP]"
          key_questions: ["[EXPERT_QUESTION_1]", "[EXPERT_QUESTION_2]"]
          expected_insights: "[WHAT_EXPERTS_CAN_REVEAL]"
          
      industry_analysis:
        analyst_reports: ["[REPORT_SOURCE_1]", "[REPORT_SOURCE_2]"]
        conference_insights: ["[CONFERENCE_1]", "[CONFERENCE_2]"]
        publication_research: ["[PUBLICATION_1]", "[PUBLICATION_2]"]
        
  validation_criteria:
    problem_existence_validation:
      - criteria: "Problem affects target population"
        measurement: "[HOW_TO_MEASURE_PROBLEM_PREVALENCE]"
        threshold: "[MINIMUM_PERCENTAGE_OR_NUMBER_AFFECTED]"
        validation_method: "[RESEARCH_METHOD_TO_VALIDATE]"
        
    problem_severity_validation:
      - criteria: "Problem causes significant impact"
        measurement: "[HOW_TO_MEASURE_IMPACT_SEVERITY]"
        threshold: "[MINIMUM_SEVERITY_LEVEL]"
        validation_method: "[IMPACT_MEASUREMENT_APPROACH]"
        
    solution_appetite_validation:
      - criteria: "Target users want a solution"
        measurement: "[HOW_TO_MEASURE_SOLUTION_INTEREST]"
        threshold: "[MINIMUM_INTEREST_LEVEL]"
        validation_method: "[METHOD_TO_ASSESS_INTEREST]"

# ===== MARKET ANALYSIS FRAMEWORK =====
market_analysis_framework:
  market_sizing:
    total_addressable_market:
      calculation_method: "[TOP_DOWN | BOTTOM_UP | HYBRID]"
      data_sources: ["[TAM_DATA_SOURCE_1]", "[TAM_DATA_SOURCE_2]"]
      market_definition: "[CLEAR_DEFINITION_OF_TOTAL_MARKET]"
      tam_estimate: "$[TAM_AMOUNT]"
      confidence_level: "medium" # high | medium | low
      assumptions: ["[TAM_ASSUMPTION_1]", "[TAM_ASSUMPTION_2]"]
      
    serviceable_addressable_market:
      geographic_constraints: ["[GEOGRAPHIC_LIMITATION_1]", "[GEOGRAPHIC_LIMITATION_2]"]
      demographic_constraints: ["[DEMOGRAPHIC_FILTER_1]", "[DEMOGRAPHIC_FILTER_2]"]
      technological_constraints: ["[TECH_CONSTRAINT_1]", "[TECH_CONSTRAINT_2]"]
      sam_estimate: "$[SAM_AMOUNT]"
      sam_as_percentage_of_tam: "[PERCENTAGE]%"
      
    serviceable_obtainable_market:
      competitive_positioning: "[REALISTIC_MARKET_SHARE_POTENTIAL]"
      resource_constraints: ["[RESOURCE_CONSTRAINT_1]", "[RESOURCE_CONSTRAINT_2]"]
      time_horizon: "[TIMEFRAME_FOR_MARKET_CAPTURE]"
      som_estimate: "$[SOM_AMOUNT]"
      som_as_percentage_of_sam: "[PERCENTAGE]%"
      
  market_dynamics:
    growth_trends:
      historical_growth_rate: "[HISTORICAL_CAGR]%"
      projected_growth_rate: "[PROJECTED_CAGR]%"
      growth_drivers:
        - driver: "[GROWTH_DRIVER_1]"
          impact: "high"
          timeline: "[WHEN_IMPACT_OCCURS]"
          supporting_evidence: "[EVIDENCE_FOR_THIS_DRIVER]"
          
        - driver: "[GROWTH_DRIVER_2]"
          impact: "medium"
          timeline: "[IMPACT_TIMELINE]"
          supporting_evidence: "[SUPPORTING_DATA]"
          
      growth_inhibitors:
        - inhibitor: "[GROWTH_INHIBITOR_1]"
          impact: "medium"
          mitigation: "[HOW_TO_MITIGATE_THIS_INHIBITOR]"
          
    market_segmentation:
      segmentation_criteria: "[HOW_MARKET_IS_DIVIDED]"
      segments:
        - segment_name: "[SEGMENT_1_NAME]"
          segment_size: "$[SEGMENT_VALUE]"
          growth_rate: "[SEGMENT_GROWTH_RATE]%"
          characteristics: ["[CHARACTERISTIC_1]", "[CHARACTERISTIC_2]"]
          attractiveness: "high" # high | medium | low
          
        - segment_name: "[SEGMENT_2_NAME]"
          segment_size: "$[SEGMENT_VALUE]"
          growth_rate: "[SEGMENT_GROWTH_RATE]%"
          characteristics: ["[CHARACTERISTIC_1]", "[CHARACTERISTIC_2]"]
          attractiveness: "medium"
          
  competitive_landscape:
    direct_competitors:
      - company: "[DIRECT_COMPETITOR_1]"
        market_share: "[PERCENTAGE]%"
        revenue: "$[ANNUAL_REVENUE]"
        strengths: ["[STRENGTH_1]", "[STRENGTH_2]"]
        weaknesses: ["[WEAKNESS_1]", "[WEAKNESS_2]"]
        strategy: "[THEIR_COMPETITIVE_STRATEGY]"
        
      - company: "[DIRECT_COMPETITOR_2]"
        market_share: "[PERCENTAGE]%"
        revenue: "$[ANNUAL_REVENUE]"
        strengths: ["[STRENGTH_1]", "[STRENGTH_2]"]
        weaknesses: ["[WEAKNESS_1]", "[WEAKNESS_2]"]
        strategy: "[COMPETITIVE_STRATEGY]"
        
    indirect_competitors:
      - alternative: "[INDIRECT_SOLUTION_1]"
        adoption_rate: "[PERCENTAGE]%"
        user_satisfaction: "[SATISFACTION_LEVEL]"
        switching_barriers: ["[BARRIER_1]", "[BARRIER_2]"]
        
    competitive_gaps:
      - gap: "[UNADDRESSED_NEED_1]"
        gap_size: "[SIZE_OF_OPPORTUNITY]"
        difficulty_to_address: "medium" # high | medium | low
        strategic_importance: "high"
        
      - gap: "[UNADDRESSED_NEED_2]"
        gap_size: "[OPPORTUNITY_SIZE]"
        difficulty_to_address: "low"
        strategic_importance: "medium"

# ===== AI-ENHANCED RESEARCH CAPABILITIES =====
ai_research_framework:
  ai_powered_market_research:
    market_intelligence_gathering:
      ai_prompt_template: |
        Industry: {target_industry}
        Geographic Focus: {market_geography}
        Problem Domain: {problem_area}
        
        Conduct comprehensive market intelligence analysis:
        1. Market size estimation and growth projections
        2. Key market trends and driving forces
        3. Regulatory environment and compliance requirements
        4. Technology adoption patterns and barriers
        5. Investment and funding landscape analysis
        
        Provide data-driven insights with credible sources and confidence levels.
        Focus on actionable intelligence for strategic decision-making.
        
    competitive_analysis_enhancement:
      ai_prompt_template: |
        Problem Statement: {core_problem}
        Target Market: {market_segment}
        Solution Category: {solution_type}
        
        Analyze competitive landscape including:
        1. Direct and indirect competitors mapping
        2. Competitive positioning and differentiation
        3. Pricing strategies and business models
        4. Strengths, weaknesses, and strategic vulnerabilities
        5. Market gaps and opportunity identification
        
        Include both established players and emerging competitors.
        Identify potential disruption threats and partnership opportunities.
        
  ai_assisted_problem_validation:
    survey_design_optimization:
      ai_prompt_template: |
        Problem Hypothesis: {problem_statement}
        Target Respondents: {survey_audience}
        Research Objectives: {validation_goals}
        
        Design optimal survey for problem validation:
        1. Question design for unbiased response collection
        2. Survey flow and logical progression
        3. Response validation and quality checks
        4. Sample size and statistical significance requirements
        5. Analysis framework for actionable insights
        
        Ensure survey minimizes bias while maximizing insight quality.
        
    interview_guide_development:
      ai_prompt_template: |
        User Persona: {target_interviewee}
        Problem Focus: {specific_problem_area}
        Interview Objectives: {what_to_learn}
        
        Create comprehensive interview guide:
        1. Opening questions to build rapport and context
        2. Problem exploration questions with follow-up probes
        3. Current solution and workaround investigation
        4. Impact and severity assessment questions
        5. Solution preference and adoption barrier exploration
        
        Include techniques for uncovering unstated needs and biases.
        
  data_analysis_acceleration:
    quantitative_analysis_support:
      ai_prompt_template: |
        Survey Data: {survey_results}
        Research Objectives: {analysis_goals}
        Sample Characteristics: {respondent_demographics}
        
        Analyze survey data for problem validation:
        1. Descriptive statistics and response patterns
        2. Correlation analysis between variables
        3. Segment analysis and demographic differences
        4. Statistical significance testing
        5. Actionable insights and recommendations
        
        Identify surprising findings and recommend follow-up research.
        
    qualitative_analysis_support:
      ai_prompt_template: |
        Interview Transcripts: {interview_data}
        Research Questions: {validation_objectives}
        Participant Profiles: {interviewee_characteristics}
        
        Synthesize qualitative research findings:
        1. Thematic analysis and pattern identification
        2. User journey and pain point mapping
        3. Needs hierarchy and priority assessment
        4. Quote selection and supporting evidence
        5. Insight synthesis and strategic implications
        
        Maintain participant anonymity while providing rich insights.

# ===== SOLUTION GAP ANALYSIS =====
solution_gap_framework:
  current_solution_landscape:
    existing_solutions_mapping:
      - solution_category: "[SOLUTION_TYPE_1]"
        solution_examples: ["[SOLUTION_1]", "[SOLUTION_2]"]
        adoption_rate: "[PERCENTAGE]%"
        user_satisfaction: "[SATISFACTION_SCORE]/10"
        strengths: ["[STRENGTH_1]", "[STRENGTH_2]"]
        limitations: ["[LIMITATION_1]", "[LIMITATION_2]"]
        cost_structure: "[COST_MODEL]"
        
      - solution_category: "[SOLUTION_TYPE_2]"
        solution_examples: ["[SOLUTION_3]", "[SOLUTION_4]"]
        adoption_rate: "[PERCENTAGE]%"
        user_satisfaction: "[SATISFACTION_SCORE]/10"
        strengths: ["[STRENGTH_1]", "[STRENGTH_2]"]
        limitations: ["[LIMITATION_1]", "[LIMITATION_2]"]
        cost_structure: "[COST_MODEL]"
        
    workaround_analysis:
      - workaround: "[COMMON_WORKAROUND_1]"
        usage_frequency: "[PERCENTAGE]% of users"
        effectiveness: "[EFFECTIVENESS_RATING]/10"
        effort_required: "high" # high | medium | low
        user_frustration: "high"
        improvement_potential: "[WHAT_COULD_BE_BETTER]"
        
      - workaround: "[COMMON_WORKAROUND_2]"
        usage_frequency: "[PERCENTAGE]% of users"
        effectiveness: "[EFFECTIVENESS_RATING]/10"
        effort_required: "medium"
        user_frustration: "medium"
        improvement_potential: "[IMPROVEMENT_OPPORTUNITY]"
        
  gap_identification:
    functional_gaps:
      - gap: "[FUNCTIONAL_GAP_1]"
        gap_description: "[DETAILED_DESCRIPTION_OF_MISSING_FUNCTIONALITY]"
        affected_users: "[PERCENTAGE]% of target market"
        impact_severity: "high"
        technical_complexity: "medium" # high | medium | low
        
      - gap: "[FUNCTIONAL_GAP_2]"
        gap_description: "[DESCRIPTION_OF_FUNCTIONALITY_GAP]"
        affected_users: "[PERCENTAGE]% of target market"
        impact_severity: "medium"
        technical_complexity: "low"
        
    experience_gaps:
      - gap: "[EXPERIENCE_GAP_1]"
        gap_description: "[USER_EXPERIENCE_PROBLEM]"
        experience_impact: "[HOW_THIS_AFFECTS_USER_EXPERIENCE]"
        improvement_opportunity: "[POTENTIAL_EXPERIENCE_ENHANCEMENT]"
        
    economic_gaps:
      - gap: "[COST_EFFICIENCY_GAP_1]"
        current_cost: "$[CURRENT_SOLUTION_COST]"
        cost_burden: "[WHO_BEARS_THE_COST]"
        cost_reduction_potential: "[POTENTIAL_SAVINGS]"
        
  opportunity_prioritization:
    gap_priority_matrix:
      high_impact_low_complexity:
        gaps: ["[GAP_1]", "[GAP_2]"]
        strategy: "Quick wins - prioritize for immediate development"
        
      high_impact_high_complexity:
        gaps: ["[GAP_3]", "[GAP_4]"]
        strategy: "Major opportunities - invest significant resources"
        
      low_impact_low_complexity:
        gaps: ["[GAP_5]", "[GAP_6]"]
        strategy: "Nice-to-have - consider for later phases"
        
      low_impact_high_complexity:
        gaps: ["[GAP_7]", "[GAP_8]"]
        strategy: "Avoid - not worth the investment"

# ===== RISK ASSESSMENT FRAMEWORK =====
risk_assessment_framework:
  market_risks:
    - risk: "[MARKET_RISK_1]"
      probability: "medium" # high | medium | low
      impact: "high"
      risk_description: "[DETAILED_RISK_DESCRIPTION]"
      early_warning_signs: ["[WARNING_SIGN_1]", "[WARNING_SIGN_2]"]
      mitigation_strategies: ["[MITIGATION_1]", "[MITIGATION_2]"]
      
  competitive_risks:
    - risk: "[COMPETITIVE_RISK_1]"
      probability: "high"
      impact: "medium"
      risk_description: "[COMPETITIVE_THREAT_DESCRIPTION]"
      monitoring_approach: "[HOW_TO_MONITOR_THIS_RISK]"
      response_strategy: "[HOW_TO_RESPOND_IF_RISK_MATERIALIZES]"
      
  technical_risks:
    - risk: "[TECHNICAL_RISK_1]"
      probability: "low"
      impact: "high"
      risk_description: "[TECHNICAL_CHALLENGE_DESCRIPTION]"
      validation_approach: "[HOW_TO_TEST_TECHNICAL_FEASIBILITY]"
      contingency_plan: "[BACKUP_TECHNICAL_APPROACH]"
      
  validation_risks:
    - risk: "[VALIDATION_RISK_1]"
      probability: "medium"
      impact: "medium"
      risk_description: "[RESEARCH_VALIDITY_CONCERN]"
      quality_controls: ["[QUALITY_CONTROL_1]", "[QUALITY_CONTROL_2]"]
      bias_mitigation: "[HOW_TO_REDUCE_RESEARCH_BIAS]"

