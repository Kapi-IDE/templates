---
# KAPI Team Collaboration Template
# Based on: Comprehensive AI-Augmented Coding Playbook 2025 - Part VIII Team Workflows & Collaboration
# Version: 1.0.0
# Purpose: Systematic team coordination for AI-augmented development with living specifications

template_metadata:
  id: "team-collaboration-template"
  version: "1.0.0"
  category: "project-management"
  last_updated: "2025-01-29"
  author: "KAPI AI Development Team"
  description: "Comprehensive framework for team collaboration in AI-augmented development environments"
  methodology: "Living Specifications as Team Memory with Systematic Conflict Resolution"

# ===== TEAM CONTEXT =====
team_profile:
  project: "[PROJECT_NAME]"
  team_name: "[TEAM_NAME]"
  collaboration_lead: "[LEAD_NAME]"
  team_size: "[NUMBER_OF_MEMBERS]"
  setup_date: "2025-01-29"
  
  team_composition:
    - role: "Technical Lead"
      name: "[TECH_LEAD_NAME]"
      responsibilities: ["Architecture decisions", "Code review oversight", "Technical conflict resolution"]
      ai_tool_proficiency: "expert" # expert | intermediate | beginner
      
    - role: "Senior Developer"
      name: "[SENIOR_DEV_NAME]"
      responsibilities: ["Feature implementation", "Mentoring", "Quality assurance"]
      ai_tool_proficiency: "intermediate"
      
    - role: "Product Owner"
      name: "[PO_NAME]"
      responsibilities: ["Requirements definition", "Stakeholder communication", "Priority setting"]
      ai_tool_proficiency: "beginner"

# ===== COLLABORATION PHILOSOPHY =====
collaboration_framework:
  core_principle: "Living specifications serve as persistent team memory and single source of truth"
  ai_integration_strategy: "AI amplifies human collaboration rather than replacing human communication"
  conflict_resolution_approach: "Systematic decision documentation prevents repeated discussions"
  
  team_memory_system:
    living_specifications:
      location: "[SPEC_REPOSITORY_PATH]"
      update_frequency: "Continuous with each decision"
      ownership_model: "Shared ownership with designated maintainer rotation"
      conflict_resolution: "Decision Architecture Documents (DADs) for disputed items"
      
    decision_documentation:
      format: "YAML frontmatter + Markdown explanation"
      storage: "alongside living specifications"
      review_process: "All major decisions reviewed by technical lead"
      retention_policy: "Permanent retention with version history"
      
    context_preservation:
      session_memory: "AI assistants maintain context across team member interactions"
      cross_session_continuity: "Specifications updated to reflect all decisions made"
      knowledge_transfer: "New team members onboard through specification review"

# ===== SYSTEMATIC WORKFLOW COORDINATION =====
workflow_coordination:
  specification_driven_development:
    workflow_overview: |
      1. Requirements → Living Specifications (Product Owner + AI)
      2. Specifications → Architecture Decisions (Technical Lead + AI)
      3. Architecture → Implementation Tasks (Developers + AI)
      4. Implementation → Specification Updates (Continuous)
      5. Drift Detection → Team Alignment (Automated + Human)
      
    role_specific_workflows:
      product_owner_workflow:
        primary_tools: ["Interview AI", "Stakeholder validation AI", "Requirement specification AI"]
        key_responsibilities:
          - responsibility: "Capture and document requirements"
            ai_assistance: "Generate comprehensive user stories and acceptance criteria"
            deliverable: "Living specification updates with requirements sections"
            
          - responsibility: "Validate stakeholder needs"
            ai_assistance: "Simulate stakeholder perspectives and identify conflicts"
            deliverable: "Stakeholder validation reports and requirement refinements"
            
          - responsibility: "Prioritize feature development"
            ai_assistance: "Analyze impact and effort estimations for prioritization"
            deliverable: "Prioritized backlog with rationale documentation"
            
      technical_lead_workflow:
        primary_tools: ["Architecture analysis AI", "Code review AI", "Technical decision AI"]
        key_responsibilities:
          - responsibility: "Make architectural decisions"
            ai_assistance: "Analyze alternatives and provide technical recommendations"
            deliverable: "Decision Architecture Documents (DADs) with rationale"
            
          - responsibility: "Review code quality"
            ai_assistance: "Automated code analysis with architectural compliance checking"
            deliverable: "Code review reports with specification alignment assessment"
            
          - responsibility: "Resolve technical conflicts"
            ai_assistance: "Generate technical alternatives and impact analysis"
            deliverable: "Technical conflict resolution documentation"
            
      developer_workflow:
        primary_tools: ["Implementation AI", "Testing AI", "Refactoring AI"]
        key_responsibilities:
          - responsibility: "Implement features according to specifications"
            ai_assistance: "Generate code that complies with architectural decisions"
            deliverable: "Implementation with automatic specification compliance"
            
          - responsibility: "Maintain code quality"
            ai_assistance: "Suggest refactorings and quality improvements"
            deliverable: "Clean, maintainable code with comprehensive tests"
            
          - responsibility: "Update specifications with implementation learnings"
            ai_assistance: "Identify specification gaps discovered during implementation"
            deliverable: "Specification updates reflecting implementation realities"

# ===== CONFLICT RESOLUTION FRAMEWORK =====
conflict_resolution:
  systematic_decision_process:
    decision_categories:
      architectural_conflicts:
        description: "Disagreements about technical architecture or design patterns"
        resolution_process: "Technical analysis with AI-assisted alternative evaluation"
        decision_authority: "Technical Lead with team input"
        documentation_requirement: "Decision Architecture Document (DAD)"
        
      requirement_conflicts:
        description: "Disagreements about feature scope or business requirements"
        resolution_process: "Stakeholder simulation and impact analysis"
        decision_authority: "Product Owner with stakeholder validation"
        documentation_requirement: "Requirements clarification in living specification"
        
      implementation_conflicts:
        description: "Disagreements about specific implementation approaches"
        resolution_process: "Code review with AI-assisted quality assessment"
        decision_authority: "Senior Developer with Technical Lead oversight"
        documentation_requirement: "Implementation notes in specification"
        
      priority_conflicts:
        description: "Disagreements about feature prioritization or timeline"
        resolution_process: "Impact analysis with business value assessment"
        decision_authority: "Product Owner with team effort estimates"
        documentation_requirement: "Priority rationale in project backlog"
        
  conflict_resolution_workflow:
    step_1_identification:
      process: "Team member identifies conflict requiring resolution"
      ai_assistance: "Analyze the nature and scope of the disagreement"
      output: "Conflict classification and stakeholder identification"
      
    step_2_information_gathering:
      process: "Collect relevant information and alternative perspectives"
      ai_assistance: "Generate comprehensive analysis of available options"
      output: "Options analysis with pros/cons and trade-off assessment"
      
    step_3_structured_discussion:
      process: "Facilitated team discussion using AI-generated analysis"
      ai_assistance: "Provide objective information and impact projections"
      output: "Team discussion summary with key points and concerns"
      
    step_4_decision_documentation:
      process: "Document final decision with rationale and implementation plan"
      ai_assistance: "Generate comprehensive decision documentation"
      output: "Decision Architecture Document or specification update"
      
    step_5_follow_up_validation:
      process: "Monitor decision implementation and validate outcomes"
      ai_assistance: "Track decision impact and identify any needed adjustments"
      output: "Decision outcome assessment and lessons learned"

# ===== COMMUNICATION PROTOCOLS =====
communication_protocols:
  asynchronous_collaboration:
    living_specification_updates:
      notification_system: "Automated notifications when specifications are updated"
      review_requirements: "All specification changes reviewed within 24 hours"
      conflict_escalation: "Automatic escalation if consensus not reached in 48 hours"
      
    decision_documentation:
      decision_announcement: "New decisions communicated to all team members"
      rationale_sharing: "Decision rationale accessible in living specifications"
      implementation_guidance: "Clear implementation instructions provided"
      
    progress_transparency:
      daily_progress_updates: "Automated progress summaries from AI analysis"
      specification_drift_alerts: "Real-time notifications of spec-code alignment issues"
      quality_metrics_sharing: "Regular code quality and project health reports"
      
  synchronous_collaboration:
    scheduled_alignment_meetings:
      specification_reviews:
        frequency: "Weekly"
        duration: "30 minutes"
        participants: "All team members"
        agenda: "Review specification updates, address drift, plan upcoming work"
        ai_preparation: "Generate meeting agenda based on recent specification changes"
        
      architectural_decision_meetings:
        frequency: "As needed"
        duration: "60 minutes"
        participants: "Technical team + Product Owner"
        agenda: "Resolve architectural conflicts, make technical decisions"
        ai_preparation: "Prepare technical alternatives analysis and impact assessment"
        
      retrospective_meetings:
        frequency: "Bi-weekly"
        duration: "45 minutes"
        participants: "All team members"
        agenda: "Review collaboration effectiveness, improve processes"
        ai_preparation: "Analyze team collaboration metrics and suggest improvements"
        
  communication_standards:
    decision_announcement_template: |
      Subject: [DECISION TYPE] - [BRIEF_DESCRIPTION]
      
      Decision Made: [CLEAR_STATEMENT_OF_DECISION]
      Rationale: [KEY_REASONING_POINTS]
      Impact: [WHO_IS_AFFECTED_AND_HOW]
      Timeline: [WHEN_DECISION_TAKES_EFFECT]
      Documentation: [LINK_TO_DETAILED_DOCUMENTATION]
      Questions: [HOW_TO_GET_CLARIFICATION]
      
    specification_update_template: |
      Specification Updated: [SECTION_MODIFIED]
      Change Type: [ADDITION | MODIFICATION | DELETION]
      Reason: [WHY_CHANGE_WAS_NEEDED]
      Impact: [IMPLEMENTATION_IMPLICATIONS]
      Review Needed: [WHO_NEEDS_TO_REVIEW_AND_WHEN]

# ===== KNOWLEDGE SHARING FRAMEWORK =====
knowledge_sharing:
  expertise_distribution:
    skill_mapping:
      - team_member: "[TEAM_MEMBER_NAME]"
        primary_expertise: "[PRIMARY_SKILL_AREA]"
        secondary_expertise: ["[SKILL_2]", "[SKILL_3]"]
        ai_tool_specialization: "[SPECIFIC_AI_TOOLS_MASTERED]"
        knowledge_sharing_capacity: "high" # high | medium | low
        
    knowledge_transfer_strategies:
      specification_based_onboarding:
        approach: "New team members learn through comprehensive specification review"
        ai_assistance: "Generate personalized onboarding paths based on role and experience"
        success_measurement: "Time to productive contribution and specification comprehension"
        
      cross_training_sessions:
        frequency: "Monthly"
        format: "Team member teaches specific expertise area to others"
        ai_preparation: "Generate teaching materials and hands-on exercises"
        documentation: "Session summaries added to team knowledge base"
        
      pair_programming_with_ai:
        approach: "Experienced and novice developers collaborate with AI assistance"
        ai_role: "Provide context and suggestions while preserving human learning"
        outcome: "Knowledge transfer while maintaining development velocity"
        
  institutional_memory_preservation:
    decision_history_tracking:
      storage: "All decisions preserved in searchable format"
      context_preservation: "Full reasoning and alternatives documented"
      evolution_tracking: "How decisions changed over time and why"
      
    lessons_learned_documentation:
      collection_method: "Regular retrospectives with AI-assisted analysis"
      categorization: "Technical, process, communication, and tool-related learnings"
      application: "Lessons integrated into future decision-making processes"
      
    expertise_documentation:
      tacit_knowledge_capture: "AI-assisted interviews to document undocumented expertise"
      best_practices_codification: "Successful patterns documented in living specifications"
      mistake_prevention: "Common errors documented with prevention strategies"

# ===== AI TOOL COORDINATION =====
ai_tool_coordination:
  unified_ai_strategy:
    tool_selection_criteria:
      task_complexity_matching: "Match AI tool capabilities to task complexity requirements"
      cost_optimization: "Balance tool capabilities with project budget constraints"
      team_skill_alignment: "Consider team member proficiency with different AI tools"
      integration_requirements: "Ensure AI tools integrate well with team workflows"
      
    shared_ai_configurations:
      prompt_libraries:
        location: "[SHARED_PROMPT_REPOSITORY]"
        maintenance: "Team-maintained with version control"
        specialization: "Role-specific prompt collections"
        quality_assurance: "Peer review of prompt modifications"
        
      context_templates:
        specification_context: "Standard format for providing specification context to AI"
        project_context: "Consistent project information template"
        decision_context: "Framework for presenting decisions to AI for analysis"
        
      quality_standards:
        ai_output_validation: "Systematic review process for AI-generated content"
        human_oversight_requirements: "Clear guidelines for when human review is mandatory"
        error_handling: "Procedures for addressing AI-generated errors or inconsistencies"
        
  collaborative_ai_usage:
    shared_ai_sessions:
      architecture_reviews: "Team participates in AI-assisted architecture analysis"
      code_reviews: "Collective review of AI-generated code with team input"
      specification_development: "Collaborative specification creation with AI assistance"
      
    ai_decision_transparency:
      reasoning_visibility: "AI reasoning processes visible to all team members"
      alternative_consideration: "AI presents multiple options for team consideration"
      confidence_indicators: "AI provides confidence levels for recommendations"
      
    consistency_maintenance:
      shared_context_management: "Team maintains consistent AI context across interactions"
      decision_propagation: "Decisions made with AI assistance communicated to all AI sessions"
      specification_synchronization: "All AI interactions reference current living specifications"

# ===== PERFORMANCE METRICS AND OPTIMIZATION =====
team_performance_metrics:
  collaboration_effectiveness:
    decision_making_speed:
      measurement: "Average time from conflict identification to resolution"
      target: "[TARGET_RESOLUTION_TIME]"
      current_performance: "[CURRENT_AVERAGE_TIME]"
      improvement_trend: "[TREND_DIRECTION]"
      
    specification_alignment:
      measurement: "Percentage of time specifications accurately reflect implementation"
      target: "[TARGET_ALIGNMENT_PERCENTAGE]%"
      current_performance: "[CURRENT_ALIGNMENT_PERCENTAGE]%"
      drift_frequency: "[AVERAGE_TIME_BETWEEN_ALIGNMENT_ISSUES]"
      
    knowledge_sharing_effectiveness:
      measurement: "Time for new team members to reach productive contribution"
      target: "[TARGET_ONBOARDING_TIME]"
      current_performance: "[CURRENT_ONBOARDING_TIME]"
      knowledge_retention: "[PERCENTAGE_OF_SHARED_KNOWLEDGE_RETAINED]%"
      
  development_velocity_metrics:
    feature_delivery_speed:
      measurement: "Time from specification to working implementation"
      target: "[TARGET_DELIVERY_TIME]"
      current_performance: "[CURRENT_DELIVERY_TIME]"
      quality_maintenance: "[DEFECT_RATE_DURING_FAST_DELIVERY]"
      
    rework_frequency:
      measurement: "Percentage of work requiring significant revision"
      target: "[TARGET_REWORK_PERCENTAGE]%"
      current_performance: "[CURRENT_REWORK_PERCENTAGE]%"
      rework_reasons: "[PRIMARY_CAUSES_OF_REWORK]"
      
    specification_stability:
      measurement: "Frequency of specification changes after implementation begins"
      target: "[TARGET_CHANGE_FREQUENCY]"
      current_performance: "[CURRENT_CHANGE_FREQUENCY]"
      change_impact: "[AVERAGE_IMPLEMENTATION_IMPACT_OF_CHANGES]"
      
  ai_integration_success:
    ai_assistance_adoption:
      measurement: "Percentage of team members actively using AI tools effectively"
      target: "[TARGET_ADOPTION_PERCENTAGE]%"
      current_performance: "[CURRENT_ADOPTION_PERCENTAGE]%"
      proficiency_development: "[RATE_OF_SKILL_IMPROVEMENT]"
      
    ai_output_quality:
      measurement: "Percentage of AI-generated content requiring minimal modification"
      target: "[TARGET_QUALITY_PERCENTAGE]%"
      current_performance: "[CURRENT_QUALITY_PERCENTAGE]%"
      quality_improvement_trend: "[TREND_IN_AI_OUTPUT_QUALITY]"

# ===== CONTINUOUS IMPROVEMENT PROCESS =====
continuous_improvement:
  regular_assessment_schedule:
    weekly_collaboration_check:
      focus: "Immediate collaboration issues and quick wins"
      duration: "15 minutes"
      participants: "All team members"
      ai_preparation: "Generate summary of collaboration metrics from past week"
      
    monthly_process_optimization:
      focus: "Systematic improvements to collaboration processes"
      duration: "60 minutes"
      participants: "All team members"
      ai_preparation: "Analyze collaboration patterns and suggest optimizations"
      
    quarterly_strategy_review:
      focus: "Overall collaboration strategy and tool effectiveness"
      duration: "120 minutes"
      participants: "All team members + stakeholders"
      ai_preparation: "Comprehensive analysis of collaboration effectiveness and ROI"
      
  improvement_implementation:
    identified_opportunities:
      - opportunity: "[SPECIFIC_IMPROVEMENT_AREA]"
        current_performance: "[CURRENT_STATE_MEASUREMENT]"
        target_improvement: "[DESIRED_IMPROVEMENT_GOAL]"
        implementation_approach: "[SPECIFIC_ACTIONS_TO_IMPLEMENT]"
        success_metrics: "[HOW_TO_MEASURE_SUCCESS]"
        timeline: "[IMPLEMENTATION_TIMELINE]"
        owner: "[RESPONSIBLE_TEAM_MEMBER]"
        
    experimentation_framework:
      improvement_hypotheses: "Systematic testing of collaboration improvements"
      pilot_programs: "Small-scale trials of new collaboration approaches"
      results_measurement: "Quantitative assessment of improvement effectiveness"
      rollout_decisions: "Data-driven decisions about adopting improvements team-wide"

