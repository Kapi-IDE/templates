    technical_competency:
      description: "Technical skills, experience level, and domain expertise"
      measurement_method: "Skills assessment + project contribution analysis + peer feedback"
      ai_assistance_impact: "Determines complexity and depth of AI-generated technical content"
      
    cognitive_style:
      description: "How developer processes information and approaches problem-solving"
      measurement_method: "Working style observation + problem-solving approach analysis"
      ai_assistance_impact: "Influences AI communication style and information presentation format"
      
    ai_collaboration_readiness:
