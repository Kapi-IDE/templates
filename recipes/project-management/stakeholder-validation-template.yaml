---
# KAPI Stakeholder Validation Template
# Based on: Comprehensive AI-Augmented Coding Playbook 2025 - Part IV Advanced Interview & Validation
# Version: 1.0.0
# Purpose: Systematic stakeholder conflict simulation and requirements validation

template_metadata:
  id: "stakeholder-validation-template"
  version: "1.0.0"
  category: "project-management"
  last_updated: "2025-01-29"
  author: "KAPI AI Development Team"
  description: "Transform AI into multi-perspective validation engine capturing organizational tribal knowledge"
  methodology: "Systematic Stakeholder Conflict Simulation"

# ===== PROJECT CONTEXT =====
project: "[PROJECT_NAME]"
validation_phase: "requirements" # requirements | architecture | implementation | deployment
validation_date: "2025-01-29"
facilitated_by: "[TEAM_LEAD_NAME]"
participants: ["[STAKEHOLDER_1]", "[STAKEHOLDER_2]", "[STAKEHOLDER_3]"]

# ===== VALIDATION OBJECTIVES =====
validation_objectives:
  primary_goal: "[Primary outcome sought from this validation]"
  success_criteria:
    - "[Specific measurable outcome 1]"
    - "[Specific measurable outcome 2]"
    - "[Stakeholder alignment indicator]"
  
  knowledge_capture:
    - tribal_knowledge: "[Undocumented organizational practices to surface]"
    - risk_identification: "[Hidden risks to uncover]"
    - constraint_discovery: "[Unstated limitations to identify]"
    - evolution_planning: "[Future considerations to address]"

# ===== TECHNIQUE 1: RED TEAM ARCHITECTURE REVIEW =====
red_team_simulation:
  objective: "Challenge architectural decisions to identify critical flaws before production"
  ai_role: "Hostile enterprise architect conducting security and scalability review"
  
  target_areas:
    architecture_decisions:
      - decision: "[Primary architectural choice]"
        challenge_focus: "[Specific weaknesses to probe]"
        failure_scenarios: ["[Failure mode 1]", "[Failure mode 2]"]
        
    security_vulnerabilities:
      - attack_vector: "[Potential security threat]"
        likelihood: "medium" # high | medium | low
        impact: "high" # high | medium | low
        current_mitigation: "[Existing protection]"
        additional_mitigation: "[Recommended enhancement]"
        
    scaling_bottlenecks:
      - component: "[System component at risk]"
        failure_point: "[Capacity threshold]"
        symptoms: "[Warning signs]"
        mitigation_strategy: "[Scaling approach]"
        
    operational_complexity:
      - complexity_source: "[Difficult operational aspect]"
        maintenance_burden: "[Ongoing effort required]"
        skill_requirements: "[Specialized knowledge needed]"
        simplification_options: "[Potential improvements]"
  
  prompt_template: |
    Act as a hostile enterprise architect reviewing this system design.
    Your mission is to find critical flaws that will cause production failures.
    
    Context: [ARCHITECTURE_DESCRIPTION]
    Constraints: [IDENTIFIED_LIMITATIONS]
    Timeline: [IMPLEMENTATION_SCHEDULE]
    
    Challenge every assumption. Find flaws in:
    - Attack vectors and security vulnerabilities
    - Scaling bottlenecks and performance limits  
    - Single points of failure and recovery procedures
    - Operational complexity and maintenance requirements
    
    Be brutally honest about what will break in production.
    Provide specific examples and concrete mitigation strategies.
  
  expected_outputs:
    critical_findings:
      - finding: "[Critical issue discovered]"
        evidence: "[Supporting reasoning]"
        impact: "[Specific consequences]"
        recommendation: "[Actionable mitigation]"
        
    architectural_improvements:
      - improvement: "[Recommended enhancement]"
        rationale: "[Why this helps]"
        effort_estimate: "[Implementation cost]"
        priority: "high" # high | medium | low

# ===== TECHNIQUE 2: CRISIS SCENARIO PLANNING =====
crisis_simulation:
  objective: "Stress-test specifications against realistic disaster scenarios"
  
  scenarios:
    database_catastrophe:
      description: "Primary auth database corrupted during peak hours"
      probability: "low" # high | medium | low
      impact: "critical" # critical | high | medium | low
      evaluation_criteria:
        - detection_time: "[How quickly is problem identified]"
        - recovery_procedures: "[Step-by-step restoration process]"
        - business_continuity: "[Operations during outage]"
        - communication_plan: "[Stakeholder notification strategy]"
      current_preparedness: "[Existing disaster recovery capabilities]"
      improvement_recommendations:
        - "[Specific enhancement 1]"
        - "[Specific enhancement 2]"
        
    knowledge_loss:
      description: "Lead developer with critical tribal knowledge leaves unexpectedly"
      probability: "medium"
      impact: "high"
      evaluation_criteria:
        - documentation_completeness: "[Knowledge captured in specs/docs]"
        - knowledge_transfer: "[Backup expertise available]"
        - bus_factor: "[Number of people who know critical systems]"
      current_preparedness: "[Existing knowledge sharing practices]"
      improvement_recommendations:
        - "[Documentation initiative]"
        - "[Cross-training program]"
        
    compliance_crisis:
      description: "Regulatory audit discovers GDPR/SOX violations"
      probability: "medium"
      impact: "high"
      evaluation_criteria:
        - audit_readiness: "[Documentation and controls in place]"
        - correction_procedures: "[Remediation process]"
        - prevention_measures: "[Ongoing compliance monitoring]"
      current_preparedness: "[Existing compliance framework]"
      improvement_recommendations:
        - "[Compliance enhancement 1]"
        - "[Compliance enhancement 2]"
        
    supply_chain_attack:
      description: "Critical dependency compromised with malicious code"
      probability: "medium"
      impact: "critical"
      evaluation_criteria:
        - dependency_monitoring: "[Third-party risk assessment]"
        - isolation_procedures: "[Containment strategies]"
        - recovery_timeline: "[System restoration duration]"
      current_preparedness: "[Existing security practices]"
      improvement_recommendations:
        - "[Security enhancement 1]"
        - "[Security enhancement 2]"
        
  structured_output:
    detection_mechanisms: "[How quickly problems are identified across scenarios]"
    recovery_procedures: "[Comprehensive restoration processes]"
    communication_plans: "[Stakeholder notification strategies]"
    learning_capture: "[Post-incident improvement processes]"
    preparedness_gaps: "[Critical areas needing attention]"

# ===== TECHNIQUE 3: REGULATORY COMPLIANCE DEEP DIVE =====
compliance_simulation:
  objective: "Surface hidden compliance requirements before they become violations"
  ai_role: "Compliance officer for [INDUSTRY] reviewing system architecture"
  
  regulatory_frameworks:
    data_privacy:
      regulations: ["GDPR", "CCPA", "HIPAA"]
      key_requirements:
        - requirement: "[Specific regulatory requirement]"
          current_compliance: "[How we meet this today]"
          compliance_gaps: "[Areas needing attention]"
          remediation_effort: "[Work needed to fully comply]"
          
    financial_services:
      regulations: ["SOX", "PCI DSS", "Basel III"]
      key_requirements:
        - requirement: "[Financial services requirement]"
          current_compliance: "[Current state]"
          compliance_gaps: "[Gaps identified]"
          remediation_effort: "[Work needed]"
          
    security_standards:
      frameworks: ["NIST", "ISO 27001", "SOC2"]
      key_requirements:
        - requirement: "[Security framework requirement]"
          current_compliance: "[Current security posture]"
          compliance_gaps: "[Security gaps]"
          remediation_effort: "[Security improvements needed]"
          
    accessibility:
      standards: ["WCAG", "Section 508", "ADA"]
      key_requirements:
        - requirement: "[Accessibility requirement]"
          current_compliance: "[Current accessibility level]"
          compliance_gaps: "[Accessibility issues]"
          remediation_effort: "[Accessibility improvements needed]"
  
  interview_approach:
    data_handling:
      questions:
        - "How is personal data collected, processed, and stored?"
        - "What consent mechanisms are in place?"
        - "How do you handle data subject rights (access, deletion, portability)?"
      current_practices: "[Current data handling approach]"
      compliance_assessment: "[Compliance strength/weaknesses]"
      
    audit_requirements:
      questions:
        - "What logs are maintained and for how long?"
        - "How do you demonstrate compliance to auditors?"
        - "What automated compliance monitoring is in place?"
      current_practices: "[Current audit readiness]"
      compliance_assessment: "[Audit preparation level]"
      
    security_controls:
      questions:
        - "What protections exist for sensitive data?"
        - "How do you manage privileged access?"
        - "What incident response procedures are documented?"
      current_practices: "[Current security controls]"
      compliance_assessment: "[Security compliance level]"

# ===== TECHNIQUE 4: FUTURE EVOLUTION PRESSURE TEST =====
evolution_testing:
  objective: "Validate specification flexibility against projected growth and change"
  
  future_pressures:
    user_growth:
      scenario: "Scale from 10k to 1M active users"
      timeline: "[Expected timeframe]"
      evaluation_questions:
        - "How will your authentication scale to 100k concurrent sessions?"
        - "What's your database sharding strategy for 10x data growth?"
        - "How will you maintain <200ms response times at scale?"
      current_architecture_assessment: "[How well current design handles this]"
      adaptation_requirements:
        - "[Specific change needed 1]"
        - "[Specific change needed 2]"
        
    regulatory_changes:
      scenario: "New AI privacy regulations require explainable decisions"
      timeline: "[Regulatory timeline]"
      evaluation_questions:
        - "How will you provide audit trails for all automated decisions?"
        - "What transparency mechanisms can you implement?"
        - "How will you handle right-to-explanation requests?"
      current_architecture_assessment: "[Current explainability capabilities]"
      adaptation_requirements:
        - "[Explainability enhancement 1]"
        - "[Explainability enhancement 2]"
        
    cost_pressures:
      scenario: "Cloud infrastructure costs double due to resource constraints"
      timeline: "[Economic pressure timeline]"
      evaluation_questions:
        - "How will you optimize compute costs without performance degradation?"
        - "What functionality can be moved to edge computing?"
        - "How will you implement intelligent resource scaling?"
      current_architecture_assessment: "[Current cost efficiency]"
      adaptation_requirements:
        - "[Cost optimization 1]"
        - "[Cost optimization 2]"
        
    team_scaling:
      scenario: "Engineering team grows from 5 to 25 developers"
      timeline: "[Team growth timeline]"
      evaluation_questions:
        - "How will you onboard 20 new developers to this system?"
        - "What documentation and training materials are needed?"
        - "How will you maintain code quality across larger team?"
      current_architecture_assessment: "[Current developer experience]"
      adaptation_requirements:
        - "[Developer experience improvement 1]"
        - "[Developer experience improvement 2]"
        
    technology_evolution:
      scenario: "Quantum computing threatens current encryption methods"
      timeline: "[Technology timeline]"
      evaluation_questions:
        - "What's your quantum-safe cryptography migration path?"
        - "How will you maintain security during transition period?"
        - "What backwards compatibility requirements exist?"
      current_architecture_assessment: "[Current crypto dependencies]"
      adaptation_requirements:
        - "[Cryptography upgrade 1]"
        - "[Cryptography upgrade 2]"

# ===== TECHNIQUE 5: CROSS-FUNCTIONAL IMPACT ANALYSIS =====
impact_analysis:
  objective: "Map organizational dependencies and communication requirements"
  
  department_perspectives:
    sales_engineering:
      primary_concerns:
        - "[Customer demo requirements]"
        - "[Technical discussion capability]" 
        - "[Competitive positioning]"
      requirements:
        - requirement: "[Sandbox environment for demos]"
          current_state: "[What exists today]"
          gap_analysis: "[What's missing]"
          effort_estimate: "[Work needed]"
        - requirement: "[Certification documentation]"
          current_state: "[Current documentation]"
          gap_analysis: "[Documentation gaps]"
          effort_estimate: "[Documentation work needed]"
      success_criteria:
        - "[Demo success metric]"
        - "[Customer satisfaction measure]"
        
    customer_support:
      primary_concerns:
        - "[New ticket types anticipated]"
        - "[Troubleshooting complexity]"
        - "[Escalation path clarity]"
      requirements:
        - requirement: "[User-facing troubleshooting guides]"
          current_state: "[Existing support docs]"
          gap_analysis: "[Support documentation gaps]"
          effort_estimate: "[Support preparation work]"
        - requirement: "[L2 support procedures]"
          current_state: "[Current escalation process]"
          gap_analysis: "[Process improvement needs]"
          effort_estimate: "[Process development work]"
      success_criteria:
        - "[First-contact resolution rate]"
        - "[Average resolution time]"
        
    marketing:
      primary_concerns:
        - "[Messaging strategy alignment]"
        - "[User communication approach]"
        - "[Competitive differentiation]"
      requirements:
        - requirement: "[Benefits documentation for marketing]"
          current_state: "[Current marketing materials]"
          gap_analysis: "[Marketing content gaps]"
          effort_estimate: "[Content development work]"
        - requirement: "[Risk communication strategy]"
          current_state: "[Current risk messaging]"
          gap_analysis: "[Risk communication gaps]"
          effort_estimate: "[Communication strategy work]"
      success_criteria:
        - "[Message consistency score]"
        - "[User understanding metrics]"
        
    legal_compliance:
      primary_concerns:
        - "[Contract modifications needed]"
        - "[Liability assessment]"
        - "[Regulatory compliance gaps]"
      requirements:
        - requirement: "[Legal review processes]"
          current_state: "[Current legal review]"
          gap_analysis: "[Legal process gaps]"
          effort_estimate: "[Legal preparation work]"
        - requirement: "[Compliance documentation]"
          current_state: "[Current compliance docs]"
          gap_analysis: "[Compliance documentation gaps]"
          effort_estimate: "[Compliance work needed]"
      success_criteria:
        - "[Legal review completion rate]"
        - "[Compliance audit readiness]"

# ===== VALIDATION INTEGRATION =====
validation_integration:
  backwards_build_methodology:
    red_team_outputs: 
      - deliverable: "[Security specifications and mitigation strategies]"
        integration_point: "[Where this feeds into living specs]"
    crisis_planning_outputs:
      - deliverable: "[Disaster recovery procedures and escalation matrices]" 
        integration_point: "[How this updates operational runbooks]"
    compliance_outputs:
      - deliverable: "[Regulatory requirement documentation and audit trails]"
        integration_point: "[How this enhances compliance specs]"
    evolution_outputs:
      - deliverable: "[Scalability roadmaps and technology migration plans]"
        integration_point: "[How this informs architecture decisions]"
    impact_outputs:
      - deliverable: "[Cross-functional requirements and communication protocols]"
        integration_point: "[How this updates stakeholder specs]"
        
  specification_enhancement:
    constraint_matrices: "[Comprehensive limitation documentation from all validation techniques]"
    risk_assessments: "[Identified threats and mitigation approaches across scenarios]" 
    success_criteria: "[Measurable outcomes across all stakeholder perspectives]"
    evolution_planning: "[Future change accommodation strategies from pressure testing]"
    
  decision_documentation:
    decisions_influenced: "[Major decisions validated or modified through this process]"
    new_requirements_discovered: "[Previously unknown requirements surfaced]"
    assumptions_challenged: "[Assumptions proven invalid through validation]"
    consensus_achieved: "[Areas where stakeholder alignment was reached]"

# ===== VALIDATION OUTCOMES =====
validation_outcomes:
  critical_findings:
    - finding: "[Most important discovery from validation]"
      impact: "[How this changes project approach]"
      action_required: "[Specific next steps]"
      owner: "[Who is responsible]"
      timeline: "[When this must be addressed]"
      
  requirement_changes:
    - original_requirement: "[Previous understanding]"
      validated_requirement: "[Corrected understanding]"
      change_rationale: "[Why validation changed this]"
      impact_assessment: "[How this affects project]"
      
  risk_mitigations:
    - risk_identified: "[Risk surfaced through validation]"
      mitigation_strategy: "[How we'll address this]"
      implementation_plan: "[Steps to implement mitigation]"
      success_metrics: "[How we'll measure mitigation effectiveness]"
      
  stakeholder_alignment:
    - alignment_area: "[Topic where consensus was reached]"
      previous_state: "[Before validation]"
      aligned_understanding: "[After validation]"
      communication_plan: "[How to maintain alignment]"

# ===== FOLLOW-UP ACTIONS =====
follow_up_actions:
  immediate_actions:
    - action: "[Action needed within 1 week]"
      owner: "[Responsible person]"
      deliverable: "[Expected outcome]"
      
  short_term_actions:
    - action: "[Action needed within 1 month]"
      owner: "[Responsible person]"
      deliverable: "[Expected outcome]"
      
  long_term_actions:
    - action: "[Action needed within 3 months]"
      owner: "[Responsible person]"
      deliverable: "[Expected outcome]"
      
  validation_schedule:
    next_validation: "[Date for next validation session]"
    validation_frequency: "[How often to repeat this process]"
    validation_triggers: "[Conditions that require re-validation]"

# ===== SUCCESS MEASUREMENT =====
success_measurement:
  validation_effectiveness:
    requirements_clarity: "[How much clearer requirements became]"
    risk_identification: "[Number and severity of risks discovered]"
    stakeholder_alignment: "[Degree of consensus achieved]"
    tribal_knowledge_capture: "[Amount of undocumented knowledge surfaced]"
    
  process_efficiency:
    validation_duration: "[Time spent in validation]"
    participant_satisfaction: "[Stakeholder feedback on process]"
    actionable_outcomes: "[Percentage of findings that led to changes]"
    specification_quality: "[Improvement in specification completeness]"

