    components_used:
      - react-chat-ui (EXISTING - reused from components/frontend/)
      - azure-openai (EXISTING - optional alternative)
      - gemini (EXISTING - optional alternative)
    api_keys_required:
      - name: OPENAI_API_KEY
        provider: OpenAI
        cost: $0.15-$30 per 1M tokens
        signup_url: https://platform.openai.com/signup
        docs_url: https://platform.openai.com/docs
        free_tier: $5 credits for new accounts
    use_cases:
