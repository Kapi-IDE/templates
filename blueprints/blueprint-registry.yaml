  - id: perplexity-clone
    name: Perplexity Clone
    path: blueprints/core-apps/perplexity-clone
    category: core-apps
    subcategory: ai-search
    stack:
      language: TypeScript
      framework: Next.js 14
      ai: Multi-provider (OpenAI/Azure/Gemini/Claude/Ollama)
      search: Multi-provider (Brave/Serper/Google/Bing)
      ui: React
      styling: Tailwind CSS
    features:
      - Multiple LLM Providers (OpenAI, Azure OpenAI, Gemini, Claude, Ollama)
      - Multiple Search APIs (Brave, Serper, Google Custom, Bing)
      - Web Search Integration with real-time results
      - AI-Powered Answers with citations
      - Source Citations with inline links
      - Follow-up Questions with context
      - Streaming Responses
      - Related Questions suggestions
      - Clean Perplexity.ai-inspired UI
      - Responsive Design
      - FREE Option (Ollama + Brave free tier)
    setup_time: "20 min"
    loc: "~2500"
    difficulty: intermediate
    token_savings: "65%"
    provides:
      - Universal LLM client (5 providers)
      - Universal Search client (4 providers)
      - Multi-provider architecture pattern
      - Search result synthesis
      - Citation extraction
    components_used:
      - react-chat-ui (EXISTING - reused from components/frontend/)
      - azure-openai (EXISTING - optional)
      - gemini (EXISTING - optional)
      - anthropic-bedrock (EXISTING - optional)
      - node-llm-framework (NEW - Ollama support)
    api_keys_required:
      - name: LLM Provider (ONE REQUIRED)
        providers:
          - name: Ollama (LOCAL)
            cost: FREE (runs locally)
            signup_url: https://ollama.ai
            docs_url: https://ollama.ai/docs
            free_tier: Unlimited (local)
            recommended: true
          - name: OPENAI_API_KEY
            cost: $0.15-$30 per 1M tokens
            signup_url: https://platform.openai.com/signup
            docs_url: https://platform.openai.com/docs
            free_tier: $5 credits
          - name: GEMINI_API_KEY
            cost: $0.075-$7 per 1M tokens (CHEAPEST)
            signup_url: https://makersuite.google.com/app/apikey
            docs_url: https://ai.google.dev/docs
            free_tier: Yes
          - name: AZURE_OPENAI (Enterprise)
            cost: Same as OpenAI
            signup_url: https://portal.azure.com
            docs_url: https://learn.microsoft.com/azure/ai-services/openai/
            free_tier: No
          - name: CLAUDE (Bedrock)
            cost: $3-$15 per 1M tokens
            signup_url: https://aws.amazon.com/bedrock
            docs_url: https://docs.anthropic.com/
            free_tier: No
      - name: Search Provider (ONE REQUIRED)
        providers:
          - name: BRAVE_SEARCH_API_KEY
            cost: FREE (2,000/month) or $5 for 20K/month
            signup_url: https://brave.com/search/api/
            docs_url: https://brave.com/search/api/
            free_tier: 2,000 queries/month
            recommended: true
          - name: SERPER_API_KEY
            cost: $50 per 1M queries (CHEAPEST AT SCALE)
            signup_url: https://serper.dev/
            docs_url: https://serper.dev/documentation
            free_tier: 2,500 queries
          - name: GOOGLE_SEARCH_API_KEY
            cost: FREE (100/day) or $5 per 1,000
            signup_url: https://programmablesearchengine.google.com/
            docs_url: https://developers.google.com/custom-search
            free_tier: 100/day
          - name: BING_SEARCH_API_KEY
            cost: FREE (1,000/month) or $3 per 1,000
            signup_url: https://www.microsoft.com/en-us/bing/apis
            docs_url: https://www.microsoft.com/en-us/bing/apis/bing-web-search-api
            free_tier: 1,000/month
    use_cases:
      - AI-powered search engines
      - Research assistants
      - Question answering systems
      - Knowledge discovery
      - Competitive intelligence
      - Academic research tools
    documentation:
      - README.md (comprehensive multi-provider setup)
      - FREE setup guide (Ollama + Brave)
      - Environment configuration with 9 providers
      - Security best practices for multiple APIs
      - Pricing comparison tables
      - Cost per search analysis

