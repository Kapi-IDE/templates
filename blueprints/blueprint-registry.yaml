  - id: practica-clean-architecture
    name: Practica Clean Architecture (Node.js)
    path: blueprints/reference/practica-clean-architecture
    category: reference
    subcategory: backend-foundation
    stack:
      language: TypeScript
      runtime: Node.js 20+
      framework: Express
      database: PostgreSQL
      orm: Prisma
      testing: Jest + Supertest
      containerization: Docker
      observability: OpenTelemetry
    features:
      - Clean architecture with layered structure
      - Microservices-ready patterns
      - Production-grade error handling
      - Security middleware (Helmet, rate limiting)
      - Structured logging with correlation IDs
      - Comprehensive testing patterns
      - Docker multi-stage builds
      - Health checks and monitoring
    setup_time: "45 min"
    loc: "~5000"
    difficulty: advanced
    use_cases:
      - Enterprise backend APIs
      - Microservices foundation
      - Reference architecture for new projects
