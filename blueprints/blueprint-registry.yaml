# KAPI Blueprint Registry
# Complete catalog of all production-ready application blueprints
# Last updated: 2025-10-02

metadata:
  version: "1.6.0"
  total_blueprints: 20
  categories:
    - reference        # Architecture patterns (not deployed directly)
    - quickwins        # Gateway apps (fast wins in <15 min)
    - core-apps        # Core AI & productivity applications
    - starters         # Quick-start applications
    - industry         # Domain-specific applications
    - ai-advanced      # Advanced AI applications (agents, multi-agent systems)

