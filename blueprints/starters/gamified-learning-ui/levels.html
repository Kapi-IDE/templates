<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Modern AI Pro! Revolutionary new Agent-centric teaching</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/style-levels.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
</head>
<body>
    <div id="root">
        <audio id="audio-response" src="./assets/test2.m4a"></audio>
        <div class="App">
            <div class="background-overlay">
                <div class="overlay-top">
                    <div class="game-container">
                        <div class="level-header">
                            <div class="level-info">
                                <div class="level-number">51</div>
                                <div class="xp-points">1520</div>
                            </div>
                            <div class="level-labels">
                                <div class="level-label">LEVEL</div>
                                <div class="xp-label">XP</div>
                            </div>
                        </div>
                        
                        <div class="categories">
                            <div class="category">
                                <span class="category-label">ALGORITHMS</span>
                                <div class="progress">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">260</div>
                                </div>
                            </div>
                            <div class="category">
                                <span class="category-label">CODING</span>
                                <div class="progress">
                                    <div class="progress-bar bg-warning" role="progressbar" style="width: 30%;" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">80</div>
                                </div>
                            </div>
                            <div class="category">
                                <span class="category-label">MATH</span>
                                <div class="progress">
                                    <div class="progress-bar bg-info" role="progressbar" style="width: 50%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">150</div>
                                </div>
                            </div>
                            <div class="category">
                                <span class="category-label">AI KNOWL</span>
                                <div class="progress">
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: 65%;" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">220</div>
                                </div>
                            </div>
                        </div>

                        <div class="skills">
                            <div class="badge-label">BADGES</div>
                            <div class="badge">
                                <i class="fas fa-brain badge-icon"></i>
                                <span class="badge-label">ML MODELS</span>
                            </div>
                            <div class="badge">
                                <i class="fas fa-laptop-code badge-icon"></i>
                                <span class="badge-label">ML APP</span>
                            </div>
                            <div class="badge">
                                <i class="fas fa-database badge-icon"></i>
                                <span class="badge-label">BACKEND</span>
                            </div>
                        </div>
                        
                        <button class="start-button btn btn-dark">LEADERBOARD</button>
                        <button class="start-button btn btn-light">LEARN</button>
                        <button class="start-button btn btn-dark">CHALLENGE</button>
                    </div>
                    
                </div>
                <div class="overlay-bottom">
                    <textarea id="chatBox" class="robot-chat" readonly>Mitra: Let's push hard into learning. </textarea>
                    <input type="text" class="text-box" placeholder=">> Type your input...">
                </div>
            </div>
        </div>
    </div>

    <!-- JS Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
