services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    env_file:
      - .env
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  prestart:
    image: fastapi-fullstack-backend
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    env_file:
      - .env

  backend:
    image: fastapi-fullstack-backend
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    image: fastapi-fullstack-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  app-db-data:
