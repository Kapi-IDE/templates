# ============================================================================
# QUALITY GATES
# ============================================================================

quality_standards:
  all_apps_must_have:
    - Error handling (from best practices)
    - Security middleware
    - Environment variable management
    - README with setup instructions
    - Basic test coverage (>60%)
    - Docker configuration

  ai_apps_must_have:
    - Token counting
    - Cost tracking
    - Retry logic
    - Streaming support
    - Error boundaries

  production_apps_must_have:
    - Comprehensive error handling (>80% coverage)
    - Security audit passing
    - Performance testing
    - Monitoring/observability
    - Backup strategy
    - Deployment documentation

