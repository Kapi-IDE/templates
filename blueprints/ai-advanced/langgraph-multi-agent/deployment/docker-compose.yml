version: '3.8'

services:
  langgraph-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - GRADIO_SERVER_PORT=7860
      - GRADIO_SHARE=false
    volumes:
      - ../backend:/app/backend
      - agent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  agent-data:
