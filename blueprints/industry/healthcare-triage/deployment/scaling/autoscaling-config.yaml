# Healthcare Triage System - Auto-scaling Configuration
# Kubernetes Horizontal Pod Autoscaler (HPA) and Vertical Pod Autoscaler (VPA) configurations

---
# Web Application HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-triage-web-hpa
  namespace: healthcare-triage
  labels:
    app: healthcare-triage
    component: web
    tier: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-triage-web
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Request rate-based scaling
    - type: Pods
      pods:
        metric:
          name: requests_per_second
        target:
          type: AverageValue
          averageValue: "30"
    
    # Response time-based scaling
    - type: Pods
      pods:
        metric:
          name: response_time_p95
        target:
          type: AverageValue
          averageValue: "2000m"  # 2 seconds
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

---
# AI Service HPA (More conservative scaling for AI workloads)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-triage-ai-hpa
  namespace: healthcare-triage
  labels:
    app: healthcare-triage
    component: ai-service
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-triage-ai
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # CPU-based scaling (higher threshold for AI workloads)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    
    # Memory-based scaling (critical for AI models)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
    
    # AI queue depth-based scaling
    - type: Pods
      pods:
        metric:
          name: ai_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
    
    # AI processing time-based scaling
    - type: Pods
      pods:
        metric:
          name: ai_processing_time_p95
        target:
          type: AverageValue
          averageValue: "10000m"  # 10 seconds
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180  # Longer stabilization for AI
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min  # Conservative scaling up
    
    scaleDown:
      stabilizationWindowSeconds: 600  # Much longer cool-down
      policies:
        - type: Percent
          value: 5
          periodSeconds: 120
        - type: Pods
          value: 1
          periodSeconds: 300
      selectPolicy: Min

---
# Background Worker HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-triage-worker-hpa
  namespace: healthcare-triage
  labels:
    app: healthcare-triage
    component: worker
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-triage-worker
  minReplicas: 2
  maxReplicas: 15
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    
    # Queue-based scaling (most important for workers)
    - type: Pods
      pods:
        metric:
          name: celery_queue_length
        target:
          type: AverageValue
          averageValue: "10"
    
    # Task processing rate
    - type: Pods
      pods:
        metric:
          name: tasks_processed_per_minute
        target:
          type: AverageValue
          averageValue: "20"
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # Quick response to queue buildup
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
      selectPolicy: Min

---
# Web Application VPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: healthcare-triage-web-vpa
  namespace: healthcare-triage
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-triage-web
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 3
  resourcePolicy:
    containerPolicies:
      - containerName: healthcare-triage-web
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 4Gi
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits

---
# AI Service VPA (GPU-aware)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: healthcare-triage-ai-vpa
  namespace: healthcare-triage
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-triage-ai
  updatePolicy:
    updateMode: "Off"  # Manual approval for AI workloads
  resourcePolicy:
    containerPolicies:
      - containerName: healthcare-triage-ai
        minAllowed:
          cpu: 500m
          memory: 2Gi
        maxAllowed:
          cpu: 4000m
          memory: 16Gi
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits

---
# Database Connection Pool Autoscaler
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-autoscaler
  namespace: healthcare-triage
data:
  config.yaml: |
    autoscaler:
      enabled: true
      min_pool_size: 10
      max_pool_size: 100
      target_connection_utilization: 0.7
      scale_up_threshold: 0.8
      scale_down_threshold: 0.5
      cooldown_period: 300s
    
    monitoring:
      metrics_endpoint: "http://pgbouncer-exporter:9127/metrics"
      check_interval: 30s
    
    database:
      host: "postgresql-master.healthcare-triage.svc.cluster.local"
      port: 5432
      database: "healthcare_triage"

---
# Redis Cluster Autoscaler
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-autoscaler
  namespace: healthcare-triage
data:
  scaling-rules.yaml: |
    redis_scaling:
      memory_threshold: 80
      cpu_threshold: 70
      connection_threshold: 1000
      
      scale_up_conditions:
        - memory > 80% for 300s
        - connections > 800 for 180s
        - evicted_keys > 100 per minute
      
      scale_down_conditions:
        - memory < 50% for 600s
        - connections < 200 for 600s
        - cpu < 30% for 600s
      
      min_replicas: 3
      max_replicas: 9
      scale_increment: 1

---
# Custom Metrics API Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-metrics-config
  namespace: healthcare-triage
data:
  adapter-config.yaml: |
    rules:
      # Patient queue depth metric
      - seriesQuery: 'patient_queue_depth{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^patient_queue_depth"
          as: "patient_queue_depth"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[2m])'
      
      # AI processing time metric
      - seriesQuery: 'ai_processing_duration_seconds{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^ai_processing_duration_seconds"
          as: "ai_processing_time_p95"
        metricsQuery: 'histogram_quantile(0.95, rate(<<.Series>>_bucket{<<.LabelMatchers>>}[5m])) * 1000'
      
      # Request rate metric
      - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^http_requests_total"
          as: "requests_per_second"
        metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[2m])'
      
      # Response time metric
      - seriesQuery: 'http_request_duration_seconds{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^http_request_duration_seconds"
          as: "response_time_p95"
        metricsQuery: 'histogram_quantile(0.95, rate(<<.Series>>_bucket{<<.LabelMatchers>>}[5m])) * 1000'
      
      # Celery queue length
      - seriesQuery: 'celery_queue_length{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^celery_queue_length"
          as: "celery_queue_length"
        metricsQuery: 'max_over_time(<<.Series>>{<<.LabelMatchers>>}[2m])'

---
# Pod Disruption Budget for Web Tier
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthcare-triage-web-pdb
  namespace: healthcare-triage
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: healthcare-triage
      component: web

---
# Pod Disruption Budget for AI Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthcare-triage-ai-pdb
  namespace: healthcare-triage
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: healthcare-triage
      component: ai-service

---
# Pod Disruption Budget for Workers
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthcare-triage-worker-pdb
  namespace: healthcare-triage
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: healthcare-triage
      component: worker

---
# Cluster Autoscaler Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-status
  namespace: kube-system
data:
  nodes.max: "50"
  nodes.min: "3"
  scale-down-enabled: "true"
  scale-down-delay-after-add: "10m"
  scale-down-unneeded-time: "10m"
  scale-down-utilization-threshold: "0.5"
  skip-nodes-with-local-storage: "false"
  skip-nodes-with-system-pods: "false"

---
# Priority Classes for Healthcare Workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical-healthcare-workload
value: 1000000
globalDefault: false
description: "Critical healthcare workloads that must not be evicted"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-healthcare-workload
value: 100000
globalDefault: false
description: "High priority healthcare workloads"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: normal-healthcare-workload
value: 1000
globalDefault: true
description: "Normal priority healthcare workloads"

---
# Advanced Scaling Policies
apiVersion: v1
kind: ConfigMap
metadata:
  name: advanced-scaling-policies
  namespace: healthcare-triage
data:
  emergency-scaling.yaml: |
    # Emergency scaling configuration for critical situations
    emergency_conditions:
      # Activate when critical patient queue builds up
      critical_patient_queue:
        threshold: 10
        action: scale_to_max
        components: ["web", "ai-service", "worker"]
        
      # Activate during system overload
      system_overload:
        conditions:
          - cpu_utilization > 90% for 120s
          - memory_utilization > 95% for 120s
          - response_time_p95 > 30s for 180s
        action: emergency_scale
        scale_factor: 2.0
        
      # Activate during peak hours
      peak_hours:
        schedule: "0 8-18 * * 1-5"  # Business hours
        min_replicas_multiplier: 1.5
        preemptive_scaling: true
        
    scaling_limits:
      # Maximum resources during emergency
      emergency_max:
        web_replicas: 50
        ai_replicas: 20
        worker_replicas: 30
        
      # Cost-based scaling limits
      cost_limits:
        daily_budget: 5000  # USD
        hourly_rate_limit: 300  # USD per hour
        scale_down_on_budget: true

  predictive-scaling.yaml: |
    # Predictive scaling based on historical patterns
    predictive_models:
      daily_pattern:
        enabled: true
        lookback_days: 30
        prediction_horizon: 4h
        confidence_threshold: 0.8
        
      weekly_pattern:
        enabled: true
        seasonal_adjustments: true
        holiday_calendar: "US_healthcare"
        
      emergency_pattern:
        enabled: true
        weather_correlation: true
        news_event_correlation: false
        
    machine_learning:
      model_type: "time_series_forecast"
      update_frequency: "hourly"
      features:
        - "hour_of_day"
        - "day_of_week"
        - "month_of_year"
        - "historical_patient_volume"
        - "historical_response_times"
        - "weather_data"
        
    actions:
      preemptive_scaling:
        enabled: true
        lead_time: 30m
        scale_factor: 1.2
        
      capacity_planning:
        enabled: true
        planning_horizon: 1w
        resource_reservation: true

---
# Monitoring for Autoscaling
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaling-monitoring
  namespace: healthcare-triage
data:
  prometheus-rules.yaml: |
    groups:
      - name: autoscaling_monitoring
        rules:
          - alert: HPAMaxReplicasReached
            expr: kube_horizontalpodautoscaler_status_current_replicas >= kube_horizontalpodautoscaler_spec_max_replicas
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPA has reached maximum replicas"
              description: "HPA {{ $labels.horizontalpodautoscaler }} has reached its maximum replica count"
              
          - alert: HPAScalingTooSlow
            expr: rate(kube_horizontalpodautoscaler_status_current_replicas[10m]) < 0.1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "HPA scaling is too slow"
              description: "HPA {{ $labels.horizontalpodautoscaler }} is not scaling fast enough to meet demand"
              
          - alert: FrequentScalingEvents
            expr: changes(kube_horizontalpodautoscaler_status_current_replicas[1h]) > 10
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Too many scaling events"
              description: "HPA {{ $labels.horizontalpodautoscaler }} has scaled {{ $value }} times in the last hour"
              
          - alert: NodeResourceExhaustion
            expr: (kube_node_status_allocatable_cpu_cores - kube_node_status_capacity_cpu_cores) / kube_node_status_capacity_cpu_cores < 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node running out of CPU resources"
              description: "Node {{ $labels.node }} has less than 10% CPU capacity remaining"