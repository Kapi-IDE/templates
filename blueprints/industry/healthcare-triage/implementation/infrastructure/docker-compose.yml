version: '3.8'

# Healthcare AI Triage System - Production Docker Compose
# This configuration provides a complete production-ready deployment
# with security, monitoring, and HIPAA compliance built-in

services:
  # ==========================================================================
  # DATABASE SERVICES
  # ==========================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: healthcare-triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_triage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/backups:/backups
    ports:
      - "5432:5432"
    networks:
      - healthcare_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healthcare_triage}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    command: |
      postgres
      -c log_destination=stderr
      -c log_statement=all
      -c log_min_duration_statement=0
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_preload_libraries=pg_stat_statements
      -c track_io_timing=on
      -c track_functions=all

  redis:
    image: redis:7-alpine
    container_name: healthcare-triage-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_password} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - healthcare_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  chromadb:
    image: chromadb/chroma:latest
    container_name: healthcare-triage-chromadb
    restart: unless-stopped
    environment:
      CHROMA_HOST: 0.0.0.0
      CHROMA_PORT: 8000
      CHROMA_LOG_LEVEL: INFO
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chromadb_data:/chroma/chroma
      - ./data/medical_knowledge:/chroma/import:ro
    ports:
      - "8000:8000"
    networks:
      - healthcare_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # APPLICATION SERVICES
  # ==========================================================================

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        - PYTHON_VERSION=3.11
        - APP_ENV=production
    image: healthcare-triage-backend:latest
    container_name: healthcare-triage-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/${POSTGRES_DB:-healthcare_triage}
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      CHROMADB_URL: http://chromadb:8000
      SECRET_KEY: ${SECRET_KEY:-change_this_in_production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_jwt_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-generate_32_byte_key}
      
      # AI Model Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      
      # HIPAA Compliance
      AUDIT_LOG_LEVEL: INFO
      ENCRYPT_PHI: "true"
      HIPAA_COMPLIANT_LOGGING: "true"
      
      # Performance
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_WORKER_CLASS: gevent
      GUNICORN_WORKER_CONNECTIONS: 1000
      GUNICORN_TIMEOUT: 300
      
      # Monitoring
      PROMETHEUS_ENABLED: "true"
      SENTRY_DSN: ${SENTRY_DSN}
      
    volumes:
      - backend_logs:/app/logs
      - ./config/backend:/app/config:ro
    ports:
      - "5000:5000"
    networks:
      - healthcare_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_VERSION=18
        - APP_ENV=production
    image: healthcare-triage-frontend:latest
    container_name: healthcare-triage-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api/v1}
      REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost:5000}
      REACT_APP_VERSION: ${APP_VERSION:-1.0.0}
      REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN}
      GENERATE_SOURCEMAP: "false"
    ports:
      - "3000:80"
    networks:
      - healthcare_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==========================================================================
  # REVERSE PROXY AND LOAD BALANCER
  # ==========================================================================

  nginx:
    image: nginx:1.25-alpine
    container_name: healthcare-triage-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - healthcare_network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # MONITORING AND OBSERVABILITY
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: healthcare-triage-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - healthcare_network
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:latest
    container_name: healthcare-triage-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_me}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - healthcare_network
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:latest
    container_name: healthcare-triage-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - healthcare_network
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # LOG MANAGEMENT
  # ==========================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: healthcare-triage-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-elastic_password}
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./infrastructure/logging/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    networks:
      - healthcare_network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    security_opt:
      - no-new-privileges:true

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: healthcare-triage-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-elastic_password}
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
    volumes:
      - ./infrastructure/logging/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - healthcare_network
    depends_on:
      - elasticsearch
    security_opt:
      - no-new-privileges:true

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: healthcare-triage-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xmx1g -Xms1g"
    volumes:
      - ./infrastructure/logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./infrastructure/logging/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - backend_logs:/logs/backend:ro
      - nginx_logs:/logs/nginx:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - healthcare_network
    depends_on:
      - elasticsearch
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # BACKUP AND DISASTER RECOVERY
  # ==========================================================================

  backup:
    image: postgres:15-alpine
    container_name: healthcare-triage-backup
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
    volumes:
      - ./infrastructure/backup/backup.sh:/backup.sh:ro
      - ./database/backups:/backups
    networks:
      - healthcare_network
    depends_on:
      - postgres
    command: ["sh", "/backup.sh"]
    security_opt:
      - no-new-privileges:true
    profiles:
      - backup

  # ==========================================================================
  # SECURITY SCANNING
  # ==========================================================================

  clamav:
    image: clamav/clamav:latest
    container_name: healthcare-triage-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - ./data/uploads:/scan:ro
    networks:
      - healthcare_network
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # NETWORK DEFINITIONS
  # ==========================================================================

networks:
  healthcare_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: healthcare-bridge
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500

# ==========================================================================
# VOLUME DEFINITIONS
# ==========================================================================

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  
  chromadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/chromadb
  
  backend_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/backend
  
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/nginx
  
  nginx_cache:
    driver: local
  
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/grafana
  
  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/alertmanager
  
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/elasticsearch
  
  clamav_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/clamav