  - name: Healthcare Triage
    path: /blueprints/industry/healthcare-triage
    benefit: Visualize patient flow and resource allocation

setup_time_minutes: 5
model_loading_time: "1-5 minutes (depends on model size)"

file_structure:
  - README.md: Main documentation
  - metadata.yaml: This file
  - digital-twin/:
      - DigitalTwin.js: Core component
      - README.md: Component-specific docs
      - examples/: Usage examples
  - knowledge-seismograph/:
      - KnowledgeSeismograph.js: Core component
      - README.md: Component-specific docs
      - examples/: Usage examples
  - knowledge-galaxy/:
      - KnowledgeGalaxy.js: Core component
      - README.md: Component-specific docs
      - examples/: Usage examples
  - space-animation/:
      - SpaceAnimation.js: Core component
      - README.md: Component-specific docs
      - examples/: Usage examples

production_readiness:
  digital_twin: 5/5
  knowledge_seismograph: 5/5
  knowledge_galaxy: 4/5 (needs performance optimization)
  space_animation: 5/5

known_limitations:
  - Digital Twin: Large CAD files (>100MB) may cause performance issues
  - Knowledge Seismograph: Document limit of ~1000 for optimal performance
  - Knowledge Galaxy: Bloom effects may impact mobile performance
  - Space Animation: High particle counts reduce FPS on low-end devices

business_value:
  - Reduces development time by 80% for 3D visualizations
  - Production-ready components tested in real applications
  - Saves 600+ tokens per implementation
  - Enables sophisticated UX without Three.js expertise
  - Supports multiple industries (manufacturing, aerospace, automotive)
