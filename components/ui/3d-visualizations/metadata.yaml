  three:
    url: "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    version: "0.160.0"
  tween:
    url: "https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@21.0.0/dist/tween.umd.js"
    version: "21.0.0"

combine_with:
  - name: Brahmasumm
    path: /blueprints/knowledge-management/brahmasumm
    benefit: Complete backend for knowledge management

  - name: Math Learning Platform
    path: /blueprints/education/math-learning-platform
