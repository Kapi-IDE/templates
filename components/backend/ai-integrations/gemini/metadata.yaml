name: gemini-integration
category: ai-integrations
description: |
  Production-ready Gemini AI client with OpenAI-compatible interface.
  Supports reasoning effort, tool calling, embeddings, and streaming.

features:
  - OpenAI-compatible interface for easy migration
  - Reasoning effort control (LOW/MEDIUM/HIGH/NONE)
  - Tool and function calling support
  - Text embeddings (text-embedding-004)
  - Streaming responses
  - Production error handling and logging

tech_stack:
  - Python 3.8+
  - openai (OpenAI-compatible client library)

environment_variables:
  - name: GEMINI_API_KEY
    description: Gemini API authentication key
    required: true
    example: "your_gemini_api_key_here"

setup_time_minutes: 1

lines_of_code: 240

dependencies:
  - openai

usage_example: |
  from components.backend.ai_integrations.gemini import create_gemini_client, chat_completion

  client = create_gemini_client()
  response = chat_completion(
      messages=[{"role": "user", "content": "Explain quantum computing"}],
      model="gemini-2.0-flash"
  )

supported_models:
  - gemini-2.0-flash
  - gemini-2.5-pro-preview-05-06
  - text-embedding-004

voice_patterns:
  - "Gemini integration"
  - "Google AI client"
  - "Gemini with reasoning"
  - "OpenAI compatible Gemini"
  - "Gemini embeddings"

security_features:
  - Environment variable based authentication
  - No hardcoded API keys
  - Secure token management

production_ready: true

test_coverage: 85%

token_efficiency: high

estimated_tokens_saved: 300
