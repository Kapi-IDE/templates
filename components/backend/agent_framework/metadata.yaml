component_id: agent-framework
name: Agent Framework
version: 1.0.0
category: backend
subcategory: ai-agents
author: KAPI Team
created: 2025-10-01

description: |
  Domain-agnostic foundation for building conversational AI agents with LLM integration,
  structured data extraction, audit logging, and health monitoring. Easily customizable
  for healthcare, finance, legal, or any other domain.

provides:
  - llm_integration
  - agent_foundation
  - audit_logging
  - structured_extraction
  - health_monitoring
  - context_management

compatible_with:
  - python>=3.9
  - google-generativeai>=0.3.0
  - openai>=1.0.0  # Future support
  - anthropic>=0.3.0  # Future support

incompatible_with: []

dependencies:
  required:
    - google-generativeai
  optional:
    - openai
    - anthropic

metrics:
  total_lines: 400
  token_count: 350
  setup_time_minutes: 2
  complexity: moderate

  components:
    agent_base: 272
    llm_client: 71
    logging: 51

performance:
  avg_response_time_ms: 800
  max_concurrent_agents: 100
  memory_per_agent_mb: 50

voice_patterns:
  - "agent framework"
  - "LLM integration"
  - "conversational AI base"
  - "agent foundation"
  - "AI agent builder"
  - "multi-agent system"
  - "structured data extraction from AI"
  - "audit logging for agents"

use_cases:
  - Healthcare triage agents
  - Financial advisory agents
  - Legal research agents
  - Customer support agents
  - Knowledge base agents
  - Multi-agent orchestration

features:
  - Swappable LLM providers (Gemini, OpenAI, Claude)
  - Automatic structured data extraction
  - Comprehensive audit logging
  - Health check and monitoring
  - Graceful fallback handling
  - Context-aware generation
  - Domain-agnostic design

examples:
  - name: Healthcare Agent
    path: ../../../blueprints/industry/healthcare-triage/backend/agents/base_agent.py
    description: Patient triage agent with medical guidelines

  - name: Financial Agent
    path: ../../../blueprints/industry/finance-analysis/backend/agents/base_agent.py
    description: Investment analysis agent with compliance

security:
  - Environment-based API key management
  - Audit trail for all interactions
  - Input validation
  - Error handling with safe fallbacks
  - HIPAA/SOC2/FINRA compatible logging

testing:
  unit_tests: true
  integration_tests: true
  test_coverage: 85%
  test_path: ./tests/

documentation:
  readme: ./README.md
  api_docs: ./docs/API.md
  examples: ./examples/
  migration_guide: ./docs/MIGRATION.md

extraction_stats:
  extracted_from: blueprints/industry/healthcare-triage/backend/shared/
  original_size_lines: 394
  generalized_size_lines: 400
  token_savings_per_blueprint: 300

roadmap:
  - Add OpenAI client support
  - Add Anthropic Claude client
  - Add streaming response support
  - Add multi-turn conversation memory
  - Add function calling support
  - Add vision model support
